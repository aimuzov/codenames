name: Release

# Мёрж в main только обновляет релизный PR. Мёрж этого PR выпускает релиз,
# и уже релиз уезжает на сервер. Ручной запуск деплоит любой релизный тег,
# например, чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish candidate images without deploying
        type: boolean
        default: false
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Выкладки идут по очереди, новая не обрывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Пока сервер не подготовлен (ключ, клон в /srv, сайт в Caddy), выкладка пропускается.
  # Включается переменной репозитория DEPLOY_ENABLED=true. В самом infra-site-template её нет.
  deploy:
    needs: [release, check]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не деплоит.
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR != 'true' && !inputs.build_only &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://codenames.aimuzov.online
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://codenames.aimuzov.online/
          health-url: https://codenames.aimuzov.online/api/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

  build-site:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-site'
      dockerfile: deploy/frontend.Dockerfile

  build-relay:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-relay'
      dockerfile: deploy/backend.Dockerfile

  deploy-registry:
    needs: [release, build-site, build-relay]
    if: >-
      !cancelled() && !inputs.build_only && needs.build-site.result == 'success' && needs.build-relay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - id: request
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.tag || 'main' }}
          REVISION: ${{ needs.build-site.outputs.revision }}
          IMAGE_SITE: ${{ needs.build-site.outputs.image }}
          IMAGE_RELAY: ${{ needs.build-relay.outputs.image }}
          RELAY_REVISION: ${{ needs.build-relay.outputs.revision }}
        run: |
          [[ "$REVISION" == "$RELAY_REVISION" ]]
          printf 'value=images %s %s %s\n' "$TAG" "$REVISION" "${IMAGE_SITE##*@} ${IMAGE_RELAY##*@}" >> "$GITHUB_OUTPUT"
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://codenames.aimuzov.online/
          health-url: https://codenames.aimuzov.online/api/health
          ref: ${{ steps.request.outputs.value }}
