# coturn for the voice chat. The secret comes from the command line (see docker-compose.yml),
# the relay signs short-lived credentials with the same one (src/backend/turn.ts).

listening-port=3478
min-port=49160
max-port=49200
realm=codenames.aimuzov.online
use-auth-secret
fingerprint

# Audio only: a few players per room, no need for more.
total-quota=100
max-bps=128000

# Plain TURN over UDP/TCP 3478; 443 is taken by Caddy.
no-tls
no-dtls
no-cli
no-multicast-peers
log-file=stdout
simple-log

# Without this TURN would be a proxy into the server's own networks (Docker, localhost).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
