# coturn для голосового чата. Секрет приходит из командной строки (см. docker-compose.yml),
# тем же секретом релей подписывает короткоживущие доступы (src/backend/turn.ts).

listening-port=3478
# Каждый RTCPeerConnection занимает порт релея на каждый TURN URL (UDP и TCP), даже если в итоге
# соединяется напрямую, то есть меш на 8 человек берёт 8 * 7 * 2 = 112 портов. Это 7 таких комнат.
min-port=49160
max-port=49999
realm=codenames.aimuzov.online
use-auth-secret
fingerprint

# Одновременные аллокации по всем комнатам — потолок на случай, если клиент разбушуется.
total-quota=1000
# На один доступ: игроку в полной комнате нужно 7 * 2 = 14, остальное — запас на ICE restart.
user-quota=32
# Только звук.
max-bps=128000

# Обычный TURN по UDP/TCP 3478, порт 443 занят Caddy. DTLS и CLI выключены по умолчанию
# начиная с coturn 4.18, в нём же убрали и опции, которыми их выключали.
no-tls
no-multicast-peers
log-file=stdout
simple-log

# Без этого TURN стал бы прокси во внутренние сети самого сервера (Docker, localhost).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
