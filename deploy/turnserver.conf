# coturn for the voice chat. The secret comes from the command line (see docker-compose.yml),
# the relay signs short-lived credentials with the same one (src/backend/turn.ts).

listening-port=3478
# Every RTCPeerConnection allocates a relay port per TURN URL (UDP and TCP) even when it ends
# up connecting directly, so a mesh of 8 takes 8 * 7 * 2 = 112 ports. That's 7 such rooms.
min-port=49160
max-port=49999
realm=codenames.aimuzov.online
use-auth-secret
fingerprint

# Concurrent allocations across all rooms, a cap in case a client goes wild.
total-quota=1000
# Per credential: a player in a full room needs 7 * 2 = 14, the rest is room for ICE restarts.
user-quota=32
# Audio only.
max-bps=128000

# Plain TURN over UDP/TCP 3478; 443 is taken by Caddy. DTLS and the CLI are off by default
# since coturn 4.18, which also dropped the options to turn them off.
no-tls
no-multicast-peers
log-file=stdout
simple-log

# Without this TURN would be a proxy into the server's own networks (Docker, localhost).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
