# Игра на сервере projects. Порты 80/443 держит общий Caddy из aimuzov/infra-server,
# он проксирует домен сюда по сети edge, а /ws -- релею комнат.

name: codenames

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: codenames
    container_name: codenames
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

  # Релей онлайн-комнат: пересылает сообщения между хостом и гостями, игровой логики в нём нет.
  relay:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: codenames-relay
    container_name: codenames-relay
    restart: unless-stopped
    # TURN_SECRET и TURN_URLS: по ним релей раздаёт TURN-доступы для голосового чата.
    env_file: ../.env
    # Попасть сюда можно только через Caddy (наружу портов нет), поэтому его X-Forwarded-For
    # можно доверять: по адресу клиента релей лимитирует подключения и TURN-доступы.
    environment:
      TRUST_PROXY: '1'
    networks:
      - edge
    logging: *logging

  # TURN для голосового чата: телефоны за NAT оператора напрямую друг до друга не достучатся.
  # Единственный сервис здесь, который публикует порты, да ещё и через сеть хоста: докеровский
  # прокси на диапазон UDP-портов релея обошёлся бы дороже самого звука.
  turn:
    image: coturn/coturn:4.18.0-alpine
    container_name: codenames-turn
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Пустой секрет — это пустой ключ HMAC: доступы сможет выписать кто угодно, поэтому не стартуем.
    entrypoint:
      - sh
      - -c
      - '[ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET is not set" >&2; exit 1; }; exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET"'
    logging: *logging

# Переменные сборки лежат в /srv/codenames/.env, образец в .env.example.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
